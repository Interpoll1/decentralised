<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moderation Dashboard</title>
  <style>
    /* ── Tokens ── */
    :root {
      --bg:        #0d0f14;
      --surface:   #161920;
      --surface2:  #1e2230;
      --border:    #2a2f3f;
      --accent:    #e05c3a;
      --accent-lo: rgba(224,92,58,.12);
      --ok:        #3dd68c;
      --ok-lo:     rgba(61,214,140,.12);
      --warn:      #f0a500;
      --warn-lo:   rgba(240,165,0,.12);
      --muted:     #636b85;
      --text:      #dde1ed;
      --text-dim:  #8890aa;
      --mono:      'JetBrains Mono', 'Fira Mono', monospace;
      --sans:      'Inter', system-ui, sans-serif;
      --radius:    6px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Layout ── */
    .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }

    aside {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .logo {
      padding: 0 20px 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .logo h1 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
    .logo p  { font-size: 11px; color: var(--muted); margin-top: 2px; }

    nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      text-decoration: none;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 500;
      border-left: 2px solid transparent;
      transition: all .15s;
    }
    nav a:hover { color: var(--text); background: var(--surface2); }
    nav a.active { color: var(--text); border-left-color: var(--accent); background: var(--accent-lo); }
    nav .badge {
      margin-left: auto;
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 10px;
      padding: 1px 6px;
      min-width: 18px;
      text-align: center;
    }

    main {
      padding: 32px;
      overflow-y: auto;
    }

    .page { display: none; }
    .page.active { display: block; }

    /* ── Auth gate ── */
    #auth-gate {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 40px;
      width: 340px;
    }
    .auth-card h2 { font-size: 18px; margin-bottom: 6px; }
    .auth-card p  { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

    /* ── Stats row ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
    }
    .stat-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
    .stat-card .value { font-size: 28px; font-weight: 700; font-family: var(--mono); }
    .stat-card.pending .value { color: var(--warn); }
    .stat-card.removed .value { color: var(--accent); }
    .stat-card.approved .value { color: var(--ok); }
    .stat-card.blocked .value  { color: var(--text-dim); }

    /* ── Page header ── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .page-header h2 { font-size: 20px; font-weight: 600; }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 8px 16px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
      margin-bottom: -1px;
    }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
    .tab-btn:hover { color: var(--text); }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      font-size: 13px;
    }
    tr:hover td { background: var(--surface2); }

    .soul-cell {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .snippet-cell {
      max-width: 300px;
      color: var(--text-dim);
      font-size: 12px;
      word-break: break-word;
    }

    /* ── Status badges ── */
    .badge-status {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .badge-status.pending  { background: var(--warn-lo); color: var(--warn); }
    .badge-status.removed  { background: var(--accent-lo); color: var(--accent); }
    .badge-status.approved { background: var(--ok-lo); color: var(--ok); }

    .badge-type {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--surface2);
      color: var(--text-dim);
    }

    /* ── Action buttons ── */
    .actions { display: flex; gap: 6px; white-space: nowrap; }
    .btn {
      padding: 5px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
      background: var(--surface2);
      color: var(--text);
    }
    .btn:hover { border-color: var(--text-dim); }
    .btn.danger { border-color: var(--accent); color: var(--accent); }
    .btn.danger:hover { background: var(--accent-lo); }
    .btn.ok { border-color: var(--ok); color: var(--ok); }
    .btn.ok:hover { background: var(--ok-lo); }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.primary:hover { opacity: .85; }

    /* ── Forms ── */
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
    input, select, textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 13px;
      padding: 8px 12px;
      outline: none;
      font-family: inherit;
      transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }
    select { appearance: none; }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty svg { width: 40px; height: 40px; margin-bottom: 12px; opacity: .4; }
    .empty p { font-size: 14px; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 18px;
      font-size: 13px;
      display: none;
      z-index: 200;
      box-shadow: 0 4px 20px rgba(0,0,0,.4);
    }
    #toast.show { display: block; }
    #toast.ok-toast { border-color: var(--ok); color: var(--ok); }
    #toast.err-toast { border-color: var(--accent); color: var(--accent); }

    /* ── Pagination ── */
    .pagination { display: flex; gap: 6px; justify-content: flex-end; margin-top: 16px; }

    /* ── Config panel ── */
    .config-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
    }
    .config-section h3 { font-size: 14px; font-weight: 600; margin-bottom: 16px; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  </style>
</head>
<body>

<!-- Auth Gate -->
<div id="auth-gate">
  <div class="auth-card">
    <h2>Moderation Dashboard</h2>
    <p>Enter your relay URL and admin secret to continue.</p>
    <div class="form-group">
      <label>Relay URL</label>
      <input type="text" id="relay-url" placeholder="https://your-relay.example.com" />
    </div>
    <div class="form-group">
      <label>Admin Secret</label>
      <input type="password" id="admin-secret" placeholder="ADMIN_SECRET value" />
    </div>
    <button class="btn primary" style="width:100%;padding:10px" onclick="authenticate()">Connect</button>
    <p id="auth-error" style="color:var(--accent);font-size:12px;margin-top:10px;display:none"></p>
  </div>
</div>

<!-- App shell -->
<div class="app" id="app-shell" style="display:none">
  <aside>
    <div class="logo">
      <h1>Mod Panel</h1>
      <p id="relay-label" style="font-family:var(--mono)">—</p>
    </div>
    <nav>
      <a href="#" class="active" data-page="queue" onclick="nav(this,'queue')">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16"><path d="M3 4a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H4a1 1 0 0 1-1-1zm0 4a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H4a1 1 0 0 1-1-1zm1 3a1 1 0 1 0 0 2h12a1 1 0 1 0 0-2H4z"/></svg>
        Review Queue
        <span class="badge" id="pending-badge">0</span>
      </a>
      <a href="#" data-page="blocklist" onclick="nav(this,'blocklist')">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16"><path fill-rule="evenodd" d="M13.477 14.89A6 6 0 0 1 5.11 6.524L13.477 14.89zm1.414-1.414L6.524 5.11A6 6 0 0 1 13.89 13.477zM18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0z" clip-rule="evenodd"/></svg>
        Blocklist
      </a>
      <a href="#" data-page="ban" onclick="nav(this,'ban')">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16"><path d="M10 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-7 9a7 7 0 1 1 14 0H3z"/></svg>
        Ban User
      </a>
      <a href="#" data-page="config" onclick="nav(this,'config')">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 0 1-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 0 1 .947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 0 1 2.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 0 1 2.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 0 1 .947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 0 1-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 0 1-2.287-.947zM10 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" clip-rule="evenodd"/></svg>
        Settings
      </a>
    </nav>
  </aside>

  <main>
    <!-- ── Queue page ── -->
    <div class="page active" id="page-queue">
      <div class="page-header">
        <h2>Review Queue</h2>
        <button class="btn" onclick="loadStats(); loadQueue()">↻ Refresh</button>
      </div>

      <div class="stats-row" id="stats-row">
        <div class="stat-card pending"><div class="label">Pending</div><div class="value" id="s-pending">—</div></div>
        <div class="stat-card removed"><div class="label">Removed</div><div class="value" id="s-removed">—</div></div>
        <div class="stat-card approved"><div class="label">Approved</div><div class="value" id="s-approved">—</div></div>
        <div class="stat-card blocked"><div class="label">Blocked</div><div class="value" id="s-blocked">—</div></div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(this,'pending')">Pending</button>
        <button class="tab-btn" onclick="switchTab(this,'removed')">Removed</button>
        <button class="tab-btn" onclick="switchTab(this,'approved')">Approved</button>
      </div>

      <div id="queue-table-wrap">
        <div class="empty"><p>Loading…</p></div>
      </div>

      <div class="pagination" id="queue-pagination"></div>
    </div>

    <!-- ── Blocklist page ── -->
    <div class="page" id="page-blocklist">
      <div class="page-header">
        <h2>Blocklist</h2>
        <button class="btn primary" onclick="showAddBlocklist()">+ Add entry</button>
      </div>
      <div id="add-blocklist-form" style="display:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px">
        <h3 style="font-size:14px;margin-bottom:16px">Add to blocklist</h3>
        <div class="row-2">
          <div class="form-group">
            <label>Type</label>
            <select id="bl-type"><option value="soul">Soul (Gun node path)</option><option value="cid">CID (Image hash)</option><option value="pubkey">Public key</option></select>
          </div>
          <div class="form-group">
            <label>Value</label>
            <input type="text" id="bl-value" placeholder="v2/communities/.../posts/post-xxx" />
          </div>
        </div>
        <div class="form-group"><label>Reason</label><input type="text" id="bl-reason" placeholder="Optional reason" /></div>
        <div style="display:flex;gap:8px">
          <button class="btn danger" onclick="addBlocklistEntry()">Block</button>
          <button class="btn" onclick="document.getElementById('add-blocklist-form').style.display='none'">Cancel</button>
        </div>
      </div>
      <div id="blocklist-table-wrap"><div class="empty"><p>Loading…</p></div></div>
    </div>

    <!-- ── Ban user page ── -->
    <div class="page" id="page-ban">
      <div class="page-header"><h2>Ban User by Public Key</h2></div>
      <div class="config-section" style="max-width:540px">
        <div class="form-group"><label>Public Key (hex)</label><input type="text" id="ban-pubkey" placeholder="64-character hex public key" /></div>
        <div class="form-group"><label>Reason</label><textarea id="ban-reason" placeholder="Reason for ban"></textarea></div>
        <button class="btn danger" onclick="banUser()">Ban user</button>
      </div>
    </div>

    <!-- ── Settings page ── -->
    <div class="page" id="page-config">
      <div class="page-header"><h2>Settings</h2></div>
      <div class="config-section" style="max-width:540px">
        <h3>Connection</h3>
        <div class="form-group"><label>Relay URL</label><input type="text" id="cfg-relay-url" /></div>
        <div class="form-group"><label>Admin Secret</label><input type="password" id="cfg-secret" /></div>
        <button class="btn primary" onclick="saveConfig()">Save</button>
      </div>
    </div>
  </main>
</div>

<div id="toast"></div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let CFG = { relayUrl: '', secret: '' };
  let currentTab = 'pending';
  let currentPage = 0;
  const PAGE_SIZE = 50;

  // ── Auth ───────────────────────────────────────────────────────────────────
  async function authenticate() {
    const url = document.getElementById('relay-url').value.trim().replace(/\/$/, '');
    const secret = document.getElementById('admin-secret').value.trim();
    if (!url || !secret) return showAuthError('Both fields required');
    try {
      const r = await apiFetch('/admin/mod/stats', 'GET', null, url, secret);
      if (!r.ok) { showAuthError('Invalid secret or relay unreachable'); return; }
      CFG = { relayUrl: url, secret };
      localStorage.setItem('mod-cfg', JSON.stringify(CFG));
      bootApp();
    } catch (e) { showAuthError('Cannot reach relay: ' + e.message); }
  }

  function showAuthError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg; el.style.display = 'block';
  }

  function bootApp() {
    document.getElementById('auth-gate').style.display = 'none';
    document.getElementById('app-shell').style.display = 'grid';
    document.getElementById('relay-label').textContent = new URL(CFG.relayUrl).hostname;
    document.getElementById('cfg-relay-url').value = CFG.relayUrl;
    document.getElementById('cfg-secret').value = CFG.secret;
    loadStats();
    loadQueue();
  }

  // ── API helper ─────────────────────────────────────────────────────────────
  async function apiFetch(path, method = 'GET', body = null, relayUrl, secret) {
    const base = relayUrl || CFG.relayUrl;
    const sec  = secret  || CFG.secret;
    const opts = {
      method,
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${sec}` },
    };
    if (body) opts.body = JSON.stringify(body);
    return fetch(base + path, opts);
  }

  async function api(path, method = 'GET', body = null) {
    const r = await apiFetch(path, method, body);
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    return r.json();
  }

  // ── Navigation ─────────────────────────────────────────────────────────────
  function nav(el, page) {
    document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
    el.classList.add('active');
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    if (page === 'blocklist') loadBlocklist();
    if (page === 'queue') loadQueue();
  }

  function switchTab(btn, tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = tab;
    currentPage = 0;
    loadQueue();
  }

  // ── Stats ──────────────────────────────────────────────────────────────────
  async function loadStats() {
    try {
      const d = await api('/admin/mod/stats');
      document.getElementById('s-pending').textContent  = d.queue.pending;
      document.getElementById('s-removed').textContent  = d.queue.removed;
      document.getElementById('s-approved').textContent = d.queue.approved;
      document.getElementById('s-blocked').textContent  = d.blocklist.total;
      document.getElementById('pending-badge').textContent = d.queue.pending;
    } catch(e) { console.error(e); }
  }

  // ── Queue ──────────────────────────────────────────────────────────────────
  async function loadQueue() {
    const wrap = document.getElementById('queue-table-wrap');
    wrap.innerHTML = '<div class="empty"><p>Loading…</p></div>';
    try {
      const d = await api(`/admin/mod/queue?status=${currentTab}&limit=${PAGE_SIZE}&offset=${currentPage * PAGE_SIZE}`);
      if (!d.items.length) {
        wrap.innerHTML = '<div class="empty"><p>No items in this queue.</p></div>';
        document.getElementById('queue-pagination').innerHTML = '';
        return;
      }
      wrap.innerHTML = `
        <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Type</th><th>Soul</th><th>Content snippet</th><th>Flagged</th><th>Reason</th>
            ${currentTab === 'pending' ? '<th>Actions</th>' : '<th>Reviewed by</th>'}
          </tr></thead>
          <tbody>
            ${d.items.map(item => `
              <tr>
                <td><span class="badge-type">${item.content_type}</span></td>
                <td><div class="soul-cell" title="${esc(item.soul)}">${esc(item.soul)}</div></td>
                <td><div class="snippet-cell">${esc(item.content_snippet || '—')}</div></td>
                <td style="white-space:nowrap;color:var(--muted)">${relativeTime(item.flagged_at)}</td>
                <td style="color:var(--text-dim);font-size:12px">${esc(item.reason || '—')}</td>
                ${currentTab === 'pending' ? `
                  <td>
                    <div class="actions">
                      <button class="btn danger" onclick="removeItem('${item.id}','${esc(item.soul)}')">Remove</button>
                      <button class="btn ok" onclick="approveItem('${item.id}')">Approve</button>
                    </div>
                  </td>` : `<td style="color:var(--muted);font-size:12px">${esc(item.reviewed_by||'—')}</td>`}
              </tr>
            `).join('')}
          </tbody>
        </table>
        </div>`;
      renderPagination(d.total);
    } catch(e) {
      wrap.innerHTML = `<div class="empty"><p>Error: ${e.message}</p></div>`;
    }
  }

  function renderPagination(total) {
    const pages = Math.ceil(total / PAGE_SIZE);
    const el = document.getElementById('queue-pagination');
    if (pages <= 1) { el.innerHTML = ''; return; }
    let html = '';
    if (currentPage > 0) html += `<button class="btn" onclick="changePage(${currentPage-1})">← Prev</button>`;
    html += `<span style="padding:6px 12px;color:var(--muted);font-size:12px">${currentPage+1} / ${pages}</span>`;
    if (currentPage < pages - 1) html += `<button class="btn" onclick="changePage(${currentPage+1})">Next →</button>`;
    el.innerHTML = html;
  }

  function changePage(p) { currentPage = p; loadQueue(); }

  async function removeItem(id, soul) {
    const reason = prompt(`Reason for removing:\n${soul}`, 'Illegal content');
    if (reason === null) return;
    try {
      await api('/admin/mod/remove', 'POST', { itemId: id, reason, reviewedBy: 'admin' });
      toast('Content removed and blocked', 'ok');
      loadStats(); loadQueue();
    } catch(e) { toast('Error: ' + e.message, 'err'); }
  }

  async function approveItem(id) {
    try {
      await api('/admin/mod/approve', 'POST', { itemId: id, reviewedBy: 'admin' });
      toast('Marked as approved', 'ok');
      loadStats(); loadQueue();
    } catch(e) { toast('Error: ' + e.message, 'err'); }
  }

  // ── Blocklist ──────────────────────────────────────────────────────────────
  async function loadBlocklist() {
    const wrap = document.getElementById('blocklist-table-wrap');
    wrap.innerHTML = '<div class="empty"><p>Loading…</p></div>';
    try {
      const d = await api('/admin/mod/blocklist');
      if (!d.items.length) { wrap.innerHTML = '<div class="empty"><p>Blocklist is empty.</p></div>'; return; }
      wrap.innerHTML = `
        <div class="table-wrap">
        <table>
          <thead><tr><th>Type</th><th>Value</th><th>Reason</th><th>Blocked</th><th>By</th><th></th></tr></thead>
          <tbody>
            ${d.items.map(item => `
              <tr>
                <td><span class="badge-type">${item.type}</span></td>
                <td><div class="soul-cell" title="${esc(item.value)}" style="max-width:320px">${esc(item.value)}</div></td>
                <td style="color:var(--text-dim);font-size:12px">${esc(item.reason||'—')}</td>
                <td style="white-space:nowrap;color:var(--muted)">${relativeTime(item.blocked_at)}</td>
                <td style="color:var(--muted)">${esc(item.blocked_by||'—')}</td>
                <td><button class="btn" onclick="unblock('${item.id}')">Unblock</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        </div>`;
    } catch(e) {
      wrap.innerHTML = `<div class="empty"><p>Error: ${e.message}</p></div>`;
    }
  }

  function showAddBlocklist() {
    const f = document.getElementById('add-blocklist-form');
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
  }

  async function addBlocklistEntry() {
    const type   = document.getElementById('bl-type').value;
    const value  = document.getElementById('bl-value').value.trim();
    const reason = document.getElementById('bl-reason').value.trim();
    if (!value) return toast('Value is required', 'err');
    try {
      await api('/admin/mod/blocklist', 'POST', { type, value, reason, addedBy: 'admin' });
      toast('Added to blocklist', 'ok');
      document.getElementById('bl-value').value = '';
      document.getElementById('bl-reason').value = '';
      document.getElementById('add-blocklist-form').style.display = 'none';
      loadBlocklist();
    } catch(e) { toast('Error: ' + e.message, 'err'); }
  }

  async function unblock(id) {
    if (!confirm('Remove this entry from the blocklist?')) return;
    try {
      await api('/admin/mod/blocklist/' + id, 'DELETE');
      toast('Entry removed', 'ok');
      loadBlocklist();
    } catch(e) { toast('Error: ' + e.message, 'err'); }
  }

  // ── Ban user ───────────────────────────────────────────────────────────────
  async function banUser() {
    const pubkey = document.getElementById('ban-pubkey').value.trim();
    const reason = document.getElementById('ban-reason').value.trim();
    if (!pubkey) return toast('Public key required', 'err');
    if (!confirm(`Ban pubkey: ${pubkey}?`)) return;
    try {
      await api('/admin/mod/ban-pubkey', 'POST', { pubkey, reason, bannedBy: 'admin' });
      toast('User banned', 'ok');
      document.getElementById('ban-pubkey').value = '';
      document.getElementById('ban-reason').value = '';
    } catch(e) { toast('Error: ' + e.message, 'err'); }
  }

  // ── Settings ───────────────────────────────────────────────────────────────
  function saveConfig() {
    CFG.relayUrl = document.getElementById('cfg-relay-url').value.trim().replace(/\/$/, '');
    CFG.secret   = document.getElementById('cfg-secret').value.trim();
    localStorage.setItem('mod-cfg', JSON.stringify(CFG));
    document.getElementById('relay-label').textContent = new URL(CFG.relayUrl).hostname;
    toast('Saved', 'ok');
  }

  // ── Utils ──────────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function relativeTime(ms) {
    const d = Date.now() - ms;
    if (d < 60000) return 'just now';
    if (d < 3600000) return Math.floor(d/60000) + 'm ago';
    if (d < 86400000) return Math.floor(d/3600000) + 'h ago';
    return Math.floor(d/86400000) + 'd ago';
  }

  let toastTimer;
  function toast(msg, type = 'ok') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'show ' + (type === 'ok' ? 'ok-toast' : 'err-toast');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 3000);
  }

  // ── Boot ───────────────────────────────────────────────────────────────────
  (function init() {
    const saved = localStorage.getItem('mod-cfg');
    if (saved) {
      try {
        const c = JSON.parse(saved);
        document.getElementById('relay-url').value = c.relayUrl || '';
        document.getElementById('admin-secret').value = c.secret || '';
      } catch {}
    }
  })();
</script>
</body>
</html>
