<style>
:root{--g:#3dff7a;--g2:#9bd9ae;--red:#ff4d5e;--bg:#040506}
*{box-sizing:border-box}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Inter,system-ui,sans-serif;color:#fff}
