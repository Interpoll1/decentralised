<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Type system: Bricolage Grotesque (display), Inter (body/UI),
         JetBrains Mono (hashes, codes, tallies — anything machine-verifiable). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="__APP_NAME__ is a browser-first decentralized social and polling app for communities, posts, chat, and verifiable voting."
    />
    <title>__APP_NAME__ - __APP_TAGLINE__</title>
    <link rel="canonical" href="__WEB_ORIGIN__/" />
    <meta name="keywords" content="polls, voting, community, discussions, opinions" />
    <meta name="author" content="__APP_NAME__" />
    <meta name="robots" content="index, follow" />

    <!-- PWA / mobile chrome. Keep theme-color in sync with the manifest
         theme_color in vite.config.ts. -->
    <meta name="theme-color" content="#141420" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="__APP_NAME__" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph / social link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__APP_NAME__" />
    <meta property="og:title" content="__APP_NAME__ — __APP_TAGLINE__" />
    <meta property="og:description" content="Create polls and discussions that live across peers, not one company's servers. Every vote is cryptographically signed and tamper-evident." />
    <meta property="og:image" content="/og-preview.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="__WEB_ORIGIN__/" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__APP_NAME__ — __APP_TAGLINE__" />
    <meta name="twitter:description" content="Create polls and discussions that live across peers, not one company's servers. Every vote is cryptographically signed and tamper-evident." />
    <meta name="twitter:image" content="/og-preview.svg" />
    <script>
      // Apply dark mode class ASAP to prevent flash of light theme.
      // Only target <html> here since <body> doesn't exist yet in <head>.
      (function() {
        var storedTheme = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
